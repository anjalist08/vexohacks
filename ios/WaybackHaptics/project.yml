name: WaybackHaptics
options:
  bundleIdPrefix: dev.wayback
  deploymentTarget:
    iOS: "17.0"
targets:
  WaybackHaptics:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.wayback.haptics.9806e3
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Wayback
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: Wayback connects to the laptop running main.py to receive navigation cues.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
