<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wayback Working Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#000; --fg:#f5f5f7; --muted:#86868b; --line:rgba(255,255,255,.14); --blue:#0a84ff; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:"Montserrat", system-ui, sans-serif; }
  body { display:grid; grid-template-rows:1fr auto; min-height:100vh; overflow:hidden; }
  .stage { display:grid; place-items:center; min-height:0; padding:16px; }
  canvas { width:min(100%, calc((100vh - 110px) * 16 / 9)); aspect-ratio:16/9; height:auto; display:block; border-radius:14px; background:#000; }
  .bar { display:flex; gap:12px; align-items:center; padding:12px 16px 18px; max-width:1100px; width:100%; margin:0 auto; }
  button { font:600 14px "Montserrat", sans-serif; color:var(--fg); background:rgba(28,28,30,.8); border:1px solid var(--line); border-radius:999px; padding:9px 16px; cursor:pointer; }
  button.primary { background:var(--blue); border-color:var(--blue); }
  input[type=range] { flex:1; accent-color:var(--blue); min-width:0; }
  .time { font:500 13px "Montserrat", sans-serif; color:var(--muted); font-variant-numeric:tabular-nums; min-width:84px; text-align:right; }
  body.render { display:block; }
  body.render .bar { display:none; }
  body.render .stage { padding:0; }
  body.render canvas { width:1920px; height:1080px; border-radius:0; }
</style>
</head>
<body>
<div class="stage"><canvas id="c" width="1920" height="1080" role="img" aria-label="Wayback working demo, 60 seconds: a simulated iPhone screen recording beside the walker and the live app updates"></canvas></div>
<div class="bar">
  <button id="play" class="primary" type="button">Play</button>
  <input id="scrub" type="range" min="0" max="60" step="0.01" value="0" aria-label="Position in the demo">
  <span class="time" id="time">0:00 / 1:00</span>
</div>
<audio id="track" src="audio/demo-audio.mp3" preload="auto"></audio>
<script>
"use strict";
/* Wayback working demo. Every state on screen comes from plan.json, which build.py makes from
   simulate.py: the real Wayback code (app.py, tracker/wrist.py, store/guidance.py,
   store/haptics.py) run on a synthetic walk. Labelled on screen as a simulation. */
const W = 1920, H = 1080, DURATION = 60;
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const MF = '"Montserrat", sans-serif', IF = '"Inter", system-ui, sans-serif';
const C = { blue: "#0A84FF", green: "#30D158", orange: "#FF9F0A", purple: "#BF5AF2", pink: "#FF375F", teal: "#64D2FF",
  indigo: "#5E5CE6", red: "#FF453A", white: "#F5F5F7", gray: "#86868B", yellow: "#FFD60A",
  route: "#147AFA", guide: "#1FC275", landmark: "#9E47F0", iosGray: "#8E8E93", iosBlue: "#007AFF", iosGreen: "#34C759",
  iosOrange: "#FF9500", iosIndigo: "#5856D6", iosPurple: "#AF52DE", iosRed: "#FF3B30", iosCyan: "#32ADE6" };
const GLOW = [C.orange, C.pink, C.purple, C.indigo, C.blue, C.teal];
const PAT = { wrong_left: [120, 120, 120], wrong_right: [120, 120, 120, 120, 120], on_track: [600], tick: [70], turn_soon: [80],
  turn_left: [500, 150, 150], turn_right: [500, 150, 150, 150, 150], turn_around: [500, 150, 500], arrived: [700, 200, 700, 200, 700],
  lost: [100, 60, 100, 60, 100, 60, 100, 60, 100] };
// store/haptics.py names -> the iPhone app's feed labels (ios/Wayback/Wayback/Guide.swift, logBuzz)
const BUZZ_LABEL = { wrong_left: ["Turn left (buzz ••)", "Facing right of route"], wrong_right: ["Turn right (buzz •••)", "Facing left of route"],
  on_track: ["Facing the right way (buzz ━━━)", "Locked onto current leg"], turn_soon: ["Turn coming up (buzz ····)", "Approaching corner"],
  turn_left: ["Turn left now (buzz ━•)", "Corner reached"], turn_right: ["Turn right now (buzz ━••)", "Corner reached"],
  turn_around: ["Turn around now (buzz ━━)", "Reverse direction"], arrived: ["Arrived at destination (buzz ━━━)", "Guidance complete"],
  lost: ["Position uncertain (buzz •••••)", "Say \"I'm at the …\" to re-anchor"] };
const LED = { idle: ["Off", "#3a3a3c"], route_started: ["Route started · green blink", C.green], recording: ["Recording · amber breathe", C.orange],
  landmark_saved: ["Place saved · purple", C.purple], navigating: ["Guiding · white breathe", C.white], turn_now: ["Turn coming · white blink", C.white],
  arrived: ["Arrived · green, then rainbow", C.green], uncertain: ["Lost · red blink", C.red], listening: ["Listening · solid blue", C.blue], flash: ["Connected · white flash", C.white] };

// ---------------------------------------------------------------- helpers
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eio = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eout = k => 1 - Math.pow(1 - k, 4);
const espring = k => k <= 0 ? 0 : k >= 1 ? 1 : 1 - Math.exp(-6 * k) * Math.cos(9 * k);
function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return "rgba(" + (n >> 16 & 255) + "," + (n >> 8 & 255) + "," + (n & 255) + "," + a + ")"; }
function rrect(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
function T(c, s, x, y, o = {}) {
  c.save(); c.font = (o.w || 600) + " " + (o.size || 24) + "px " + (o.f || MF);
  c.textAlign = o.align || "left"; c.textBaseline = o.base || "alphabetic";
  if (o.ls != null) c.letterSpacing = o.ls + "px";
  c.globalAlpha *= o.a == null ? 1 : o.a;
  if (o.grad) { const wd = c.measureText(s).width, x0 = o.align === "center" ? x - wd / 2 : o.align === "right" ? x - wd : x;
    const g = c.createLinearGradient(x0, 0, x0 + wd, 0); o.grad.forEach((col, i) => g.addColorStop(i / (o.grad.length - 1), col)); c.fillStyle = g; }
  else c.fillStyle = o.color || C.white;
  if (o.max) { let str = s; while (c.measureText(str).width > o.max && str.length > 3) str = str.slice(0, -2); if (str !== s) s = str.trimEnd() + "…"; }
  c.fillText(s, x, y); const w = c.measureText(s).width; c.restore(); return w;
}
function wrapLines(c, s, maxW, font) { c.save(); c.font = font; const out = []; let line = "";
  s.split(" ").forEach(w => { const t2 = line ? line + " " + w : w; if (c.measureText(t2).width > maxW && line) { out.push(line); line = w; } else line = t2; });
  out.push(line); c.restore(); return out; }
function glowBlob(c, x, y, r, col, a = 1) { const g = c.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, hexA(col, .55 * a)); g.addColorStop(.4, hexA(col, .18 * a)); g.addColorStop(1, hexA(col, 0)); c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2); }
function glass(c, x, y, w, h, r, o = {}) {
  c.save(); c.shadowColor = "rgba(0,0,0,.45)"; c.shadowBlur = 40; c.shadowOffsetY = 14;
  rrect(c, x, y, w, h, r); c.fillStyle = o.fill || "rgba(28,28,30,.82)"; c.fill(); c.shadowColor = "transparent";
  c.lineWidth = 1.5; c.strokeStyle = o.stroke || "rgba(255,255,255,.12)"; c.stroke();
  const g = c.createLinearGradient(x, y, x, y + h * .5); g.addColorStop(0, "rgba(255,255,255,.06)"); g.addColorStop(1, "rgba(255,255,255,0)");
  rrect(c, x, y, w, h, r); c.fillStyle = g; c.fill(); c.restore();
}
function pill(c, s, x, y, o = {}) {
  c.save(); c.font = (o.w || 600) + " " + (o.size || 22) + "px " + (o.f || MF);
  const w = c.measureText(s).width + (o.dot ? 54 : 36), h = (o.size || 22) * 1.85, x0 = o.align === "right" ? x - w : o.align === "center" ? x - w / 2 : x;
  c.globalAlpha *= o.a == null ? 1 : o.a;
  rrect(c, x0, y - h / 2, w, h, h / 2); c.fillStyle = o.fill || "rgba(44,44,46,.9)"; c.fill();
  c.lineWidth = 1.2; c.strokeStyle = o.stroke || "rgba(255,255,255,.12)"; c.stroke();
  if (o.dot) { c.beginPath(); c.arc(x0 + 24, y, 7, 0, 7); c.fillStyle = o.dot; c.shadowColor = o.dot; c.shadowBlur = 12; c.fill(); c.shadowBlur = 0; }
  c.fillStyle = o.color || C.white; c.textBaseline = "middle"; c.fillText(s, x0 + (o.dot ? 40 : 18), y + 1); c.restore(); return w;
}
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }

// ---------------------------------------------------------------- data
let P = null; const logo = new Image(); logo.src = "assets/WaybackLogo.png";
function simOf(t) { for (const [v0, v1, s0, s1] of P.segments) if (t >= v0 && t <= v1) return v1 > v0 ? lerp(s0, s1, (t - v0) / (v1 - v0)) : s0; return P.segments[P.segments.length - 1][3]; }
function rateAt(t) { for (const [v0, v1, s0, s1] of P.segments) if (t >= v0 && t < v1) return s1 > s0 ? (s1 - s0) / (v1 - v0) : 0; return 0; }
function sampleAt(s) { const S = P.samples; let lo = 0, hi = S.length - 1; if (s <= S[0].t) return S[0]; if (s >= S[hi].t) return S[hi];
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (S[m].t <= s) lo = m; else hi = m; }
  const a = S[lo], b = S[hi], k = (s - a.t) / (b.t - a.t);
  return Object.assign({}, a, { x: lerp(a.x, b.x, k), y: lerp(a.y, b.y, k), facing: a.facing + wrap(b.facing - a.facing) * k, steps: Math.round(lerp(a.steps, b.steps, k)) }); }
function wrap(a) { return ((a + 180) % 360 + 360) % 360 - 180; }
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
function listening(t) { return P.listen.some(([a, b]) => t >= a && t <= b); }
function clipAt(t) { return P.clips.find(c => t >= c.t - .02 && t < c.t + c.d + .25); }

function stateAt(t) {
  const s = simOf(t), samp = sampleAt(s);
  const st = { s, samp, recording: false, places: [], feed: [], stream: [], led: { state: "idle", t: -9 }, guidance: null, navT: null, arrivedT: null, lastBuzz: null, steps0: null };
  let lastFeedBuzz = {};
  const push = (arr, item) => arr.unshift(item);
  for (const e of P.events) {
    if (e.vt == null || e.vt > t) break;
    if (e.kind === "user") {
      push(st.feed, { kind: "YOU", title: "You: “" + e.text + "”", tint: C.iosBlue, icon: "mic", t: e.vt });
      push(st.stream, { badge: "YOU · Deepgram", col: C.blue, text: "“" + cap(e.text) + "”", t: e.vt });
      const args = Object.entries(e.args || {}).map(([k, v]) => k + '="' + (k === "target" ? "entrance" : v) + '"').join(", ");
      push(st.stream, { badge: "TOOL", col: C.teal, text: e.tool + "(" + args + ")", t: e.vt + .5, mono: true });
    } else if (e.kind === "tool") {
      if (e.data && e.data.instructions) { /* navigate */ }
    } else if (e.kind === "pulse") {   // the iPhone's one buzz rule (clean-app): pulse = on course, silence = turn
      st.pulse = { on: e.on, t: e.vt };
      push(st.stream, e.on ? { badge: "BUZZ · iPhone", col: C.green, text: "Steady pulse · facing the way to walk", t: e.vt }
                           : { badge: "BUZZ · iPhone", col: "#8e8e93", text: "Silence · turn until the pulse comes back", t: e.vt });
    } else if (e.kind === "say") {
      st.lastSay = e.text;
      push(st.stream, { badge: "WAYBACK · ElevenLabs River", col: C.purple, text: e.text, t: e.vt });
    } else if (e.kind === "led") {
      st.led = { state: e.state, period: e.period, t: e.vt };
      if (e.state === "route_started") { st.recording = true; st.steps0 = 0; push(st.feed, { kind: "WAYBACK", title: "Started route", tint: C.iosGreen, icon: "play", t: e.vt }); }
      if (!st.stream.length || st.stream[0].badge !== "BAND LIGHT" || st.stream[0].text !== LED[e.state][0])
        push(st.stream, { badge: "BAND LIGHT", col: LED[e.state][1] === C.white ? "#d1d1d6" : LED[e.state][1], text: LED[e.state][0], t: e.vt });
    } else if (e.kind === "landmark") {
      st.places.push({ label: e.label, x: e.x, y: e.y });
      push(st.feed, { kind: "WAYBACK", title: "Added landmark: " + cap(e.label), tint: C.iosPurple, icon: "pin", t: e.vt });
    } else if (e.kind === "guidance") {
      if (e.active) { if (!st.guidance) { st.navT = e.vt; push(st.feed, { kind: "WAYBACK", title: "Guiding to " + e.target, tint: C.iosCyan, icon: "walk", t: e.vt }); } st.guidance = e; }
      else if (st.guidance && e.index >= e.instructions.length - 1) { st.guidance = e; st.arrivedT = e.vt; }
    } else if (e.kind === "buzz") {
      st.lastBuzz = { cue: e.cue, t: e.vt };
      if (e.cue !== "tick" && !(lastFeedBuzz[e.cue] != null && e.vt - lastFeedBuzz[e.cue] < 8)) {
        lastFeedBuzz[e.cue] = e.vt;
        push(st.feed, { kind: "BUZZ", title: BUZZ_LABEL[e.cue][0], tint: e.cue === "arrived" ? C.iosPurple : e.cue === "on_track" ? C.iosGreen : C.iosOrange, icon: "buzz", t: e.vt });
        push(st.stream, { badge: "BUZZ · iPhone", col: e.cue === "on_track" ? C.green : e.cue === "arrived" ? C.purple : C.orange, text: BUZZ_LABEL[e.cue][0], t: e.vt });
      }
    }
  }
  if (t >= P.connect[0]) st.feed.push({ kind: "VEXO", title: "Vexo-HACK-80 connected", tint: C.iosIndigo, icon: "band", t: P.connect[0] });
  st.feed.sort((a, b) => b.t - a.t);
  st.guiding = !!(st.guidance && st.guidance.active);
  st.done = st.arrivedT != null;
  // banner, exactly as Guide.showHint builds it
  const h = samp.hint || {};
  if (st.done) st.banner = { state: "done", big: "Arrived", sub: "You reached the entrance.", arrow: 0 };
  else if (st.guiding && h.active) {
    const err = h.error_deg || 0, hs = h.state || "";
    if (hs === "wrong_left" || hs === "wrong_right") st.banner = { state: "wrong", big: Math.abs(err) >= 150 ? "Turn around" : (hs === "wrong_left" ? "Turn left" : "Turn right"), sub: Math.round(Math.abs(err)) + "° off, to the entrance", arrow: err };
    else st.banner = { state: "on", big: hs === "turn_soon" && h.next_turn && h.steps_left != null ? "Turn " + h.next_turn + " in " + h.steps_left + " step" + (h.steps_left === 1 ? "" : "s") : "Straight ahead",
      sub: h.steps_left != null ? h.steps_left + " steps on this stretch, to the entrance" : "to the entrance", arrow: err };
  } else if (st.guiding) st.banner = { state: "on", big: "Straight ahead", sub: "to the entrance", arrow: 0 };
  st.listening = listening(t);
  // band LED as shown on the wrist
  let led = st.led.state, age = t - st.led.t;
  if (led === "route_started" && age > 1.6) led = "recording";
  if (led === "landmark_saved" && age > 1.5) led = st.guiding ? "navigating" : "recording";
  if (t >= P.connect[0] && t < P.connect[1]) led = "flash";
  if (st.listening) led = "listening";
  st.ledShown = led; st.ledAge = led === st.led.state ? age : 0;
  return st;
}
function ledColor(st, t) {
  const L = st.ledShown, age = t - st.led.t;
  if (L === "idle") return [LED.idle[1], .15];
  if (L === "arrived") { if (age < 1.2) return [C.green, 1]; const hue = ((t * 220) % 360); return ["hsl", hue]; }
  if (L === "route_started") return [C.green, Math.floor(t * 4) % 2 ? 1 : .2];
  if (L === "recording") return [C.orange, .45 + .55 * (.5 + .5 * Math.sin(t * 3.2))];
  if (L === "navigating") return [C.white, .45 + .55 * (.5 + .5 * Math.sin(t * 3))];
  if (L === "turn_now") { const per = (st.led.period || 300) / 1000; return [C.white, (t % per) < per / 2 ? 1 : .15]; }
  if (L === "flash") return [C.white, Math.floor(t * 6) % 2 ? 1 : .3];
  if (L === "uncertain") return [C.red, Math.floor(t * 4) % 2 ? 1 : .2];

}
function buzzOn(st, t) { const b = st.lastBuzz; if (!b) return null; const ms = (t - b.t) * 1000; let acc = 0, on = false;
  const p = PAT[b.cue]; p.forEach((d, i) => { if (ms >= acc && ms < acc + d && i % 2 === 0) on = true; acc += d; });
  return ms >= 0 && ms < acc + 450 ? { cue: b.cue, on, k: clamp(ms / (acc + 450)) } : null; }

/* ============================================================ the iPhone (simulated screen) */
const PW = 390, PH = 844;                // iPhone points
function icon(c, name, x, y, s, col) {    // tiny SF-Symbol-like glyphs
  c.save(); c.translate(x, y); c.scale(s / 24, s / 24); c.fillStyle = col; c.strokeStyle = col; c.lineWidth = 2.4; c.lineCap = "round"; c.lineJoin = "round";
  if (name === "mic") { rrect(c, -4, -10, 8, 13, 4); c.fill(); c.beginPath(); c.arc(0, 0, 7, .1, Math.PI - .1); c.stroke(); c.beginPath(); c.moveTo(0, 7); c.lineTo(0, 10); c.stroke(); }
  else if (name === "wave") { [-8, -4, 0, 4, 8].forEach((dx, i) => { const hh = [5, 10, 14, 10, 5][i]; c.beginPath(); c.moveTo(dx, -hh / 2); c.lineTo(dx, hh / 2); c.stroke(); }); }
  else if (name === "pin") { c.beginPath(); c.arc(0, -3, 6.5, 0, 7); c.fill(); c.beginPath(); c.moveTo(-4, 1); c.lineTo(0, 10); c.lineTo(4, 1); c.fill(); c.fillStyle = "#fff"; c.beginPath(); c.arc(0, -3, 2.4, 0, 7); c.fill(); }
  else if (name === "walk") { c.beginPath(); c.arc(1, -9, 2.6, 0, 7); c.fill(); c.beginPath(); c.moveTo(0, -5); c.lineTo(-1, 3); c.lineTo(-5, 10); c.moveTo(-1, 3); c.lineTo(4, 9); c.moveTo(0, -4); c.lineTo(-5, 0); c.moveTo(0, -4); c.lineTo(5, -1); c.stroke(); }
  else if (name === "stop") { rrect(c, -6, -6, 12, 12, 2.5); c.fill(); }
  else if (name === "play") { c.beginPath(); c.moveTo(-4, -7); c.lineTo(7, 0); c.lineTo(-4, 7); c.closePath(); c.fill(); }
  else if (name === "buzz") { rrect(c, -4, -8, 8, 16, 2.5); c.stroke(); c.beginPath(); c.moveTo(-8, -4); c.lineTo(-8, 4); c.moveTo(8, -4); c.lineTo(8, 4); c.stroke(); }
  else if (name === "band") { rrect(c, -5, -9, 10, 18, 4); c.stroke(); c.beginPath(); c.arc(0, 0, 2, 0, 7); c.fill(); }
  else if (name === "gear") { c.beginPath(); for (let i = 0; i < 16; i++) { const a = i * Math.PI / 8, r = i % 2 ? 6.5 : 9; c.lineTo(Math.cos(a) * r, Math.sin(a) * r); } c.closePath(); c.fill(); c.fillStyle = "#fff"; c.beginPath(); c.arc(0, 0, 3, 0, 7); c.fill(); }

  else if (name === "uturn") { c.beginPath(); c.moveTo(5, 8); c.lineTo(5, -2); c.arc(0, -2, 5, 0, Math.PI, true); c.lineTo(-5, 4); c.stroke(); c.beginPath(); c.moveTo(-9, 1); c.lineTo(-5, 6); c.lineTo(-1, 1); c.stroke(); }
  else if (name === "arrow") { c.beginPath(); c.moveTo(0, -11); c.lineTo(8, 9); c.lineTo(0, 4); c.lineTo(-8, 9); c.closePath(); c.fill(); }
  else if (name === "check") { c.beginPath(); c.arc(0, 0, 10, 0, 7); c.fill(); c.strokeStyle = "#fff"; c.beginPath(); c.moveTo(-4.5, 0); c.lineTo(-1, 4); c.lineTo(5, -4); c.stroke(); }
  c.restore();
}
function card(c, x, y, w, h, r) { c.save(); c.shadowColor = "rgba(0,0,0,.10)"; c.shadowBlur = 14; c.shadowOffsetY = 5; rrect(c, x, y, w, h, r); c.fillStyle = "rgba(255,255,255,.93)"; c.fill(); c.shadowColor = "transparent"; c.strokeStyle = "rgba(0,0,0,.06)"; c.lineWidth = .8; c.stroke(); c.restore(); }
function phoneScreen(c, st, t) {
  // map
  c.fillStyle = "#EEF0F3"; c.fillRect(0, 0, PW, PH);
  // fit the map into the free space: below the banner (which sits under the camera picture)
  // and above the Live Activity card, chips and dock
  const camOnMap = st.recording || st.guiding;
  const topIn = st.guiding || st.done ? 56 + 56 + (camOnMap ? 140 : 0) + 98 + 8 : 136;
  const dockTop = PH - 26 - 172, bottomIn = PH - (dockTop - (st.places.length || st.recording ? 56 : 0) - (st.feed.length ? 102 : 0)) + 6;
  const kNav = st.navT != null ? eio(seg(t, st.navT, st.navT + .5)) : 0;
  const mapTop = lerp(136, topIn, kNav), mapBot = PH - bottomIn;

/* ============================================================ scenes */

const layer = document.createElement("canvas"); layer.width = W; layer.height = H; const lc = layer.getContext("2d");

const params = new URLSearchParams(location.search), renderMode = params.has("render");

const track = document.getElementById("track"), playBtn = document.getElementById("play"), scrub = document.getElementById("scrub"), timeEl = document.getElementById("time");
let playing = false, t0 = 0, startAt = 0, now = 0;

function frame(ts) { if (playing) { now = !track.paused ? track.currentTime : startAt + (ts - t0) / 1000; if (now >= DURATION) { now = DURATION; stop(); } }
