<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wayback Trail Commercial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --fg: #f5f5f7;
    --muted: #86868b;
    --glass: rgba(28, 28, 30, 0.72);
    --line: rgba(255, 255, 255, 0.14);
    --blue: #0a84ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: "Montserrat", system-ui, sans-serif; }
  body { display: grid; grid-template-rows: 1fr auto; min-height: 100vh; overflow: hidden; }
  .stage { display: grid; place-items: center; min-height: 0; padding: 16px; }
  canvas { width: min(100%, calc((100vh - 110px) * 16 / 9)); aspect-ratio: 16 / 9; height: auto; display: block; border-radius: 14px; background: #000; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
  .bar { display: flex; gap: 12px; align-items: center; padding: 12px 16px 18px; max-width: 1100px; width: 100%; margin: 0 auto; }
  button { font: 600 14px "Montserrat", sans-serif; color: var(--fg); background: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 9px 16px; cursor: pointer; backdrop-filter: blur(20px); }
  button.primary { background: var(--blue); border-color: var(--blue); }
  button[aria-pressed="true"] { border-color: var(--fg); }
  input[type=range] { flex: 1; accent-color: var(--blue); min-width: 0; }
  .time { font: 500 13px "Montserrat", sans-serif; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 84px; text-align: right; }
  body.render { display: block; }
  body.render .bar, body.render .stage { padding: 0; }
  body.render .bar { display: none; }
  body.render canvas { width: 1920px; height: 1080px; border-radius: 0; box-shadow: none; }
  @media (max-width: 600px) { .bar { flex-wrap: wrap; } }
</style>
</head>
<body>
<div class="stage"><canvas id="c" width="1920" height="1080" role="img" aria-label="Wayback Trail commercial, 60 seconds, with burned-in captions"></canvas></div>
<div class="bar">
  <button id="play" class="primary" type="button">Play</button>
  <input id="scrub" type="range" min="0" max="60" step="0.01" value="0" aria-label="Position in the commercial">
  <span class="time" id="time">0:00 / 1:00</span>
  <button id="cc" type="button" aria-pressed="true" title="Captions">CC</button>
</div>
<audio id="track" src="audio/narration.mp3" preload="auto"></audio>
<script>
"use strict";
/* ============================================================================
   Wayback Trail x Vexo — 60 second commercial.
   Everything is drawn from one function of time, render(t), so the same page
   plays live in a browser and renders frame-by-frame to video (render.mjs).
   ========================================================================== */
const W = 1920, H = 1080, DURATION = 60;
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const F = '"Montserrat", sans-serif';

// Apple system colours (dark appearance)
const C = {
  blue: "#0A84FF", green: "#30D158", orange: "#FF9F0A", purple: "#BF5AF2",
  pink: "#FF375F", teal: "#64D2FF", indigo: "#5E5CE6", yellow: "#FFD60A",
  red: "#FF453A", mint: "#63E6E2", white: "#F5F5F7", gray: "#86868B",
  g1: "#1C1C1E", g2: "#2C2C2E", g3: "#3A3A3C",
};
const GLOW = [C.orange, C.pink, C.purple, C.indigo, C.blue, C.teal];

// ---- Recorded test walk (data/logs/walk3-wrist-loop.csv replayed through tracker/wrist.py)
// [x_m, y_m, steps, t_s]. A replay, never presented as live sensing.
const WALK = [[0.0,0.0,0,0.0],[-3.5,0.0,5,25.99],[-4.9,0.0,7,27.01],[-4.9,-0.7,8,30.05],[-4.9,-2.8,11,31.07],[-4.9,-4.2,13,32.08],[-4.9,-4.9,14,33.1],[-4.9,-6.3,16,34.11],[-4.9,-7.7,18,35.13],[-6.3,-7.7,20,37.16],[-7.7,-7.7,22,38.17],[-9.1,-7.7,24,39.19],[-9.8,-7.7,25,40.2],[-11.9,-7.7,28,41.22],[-12.6,-7.7,29,43.25],[-14.0,-7.7,31,44.26],[-15.4,-7.7,33,45.28],[-16.8,-7.7,35,46.29],[-18.2,-7.7,37,47.31],[-20.3,-7.7,40,48.32],[-21.7,-7.7,42,50.35],[-21.7,-5.6,45,51.37],[-21.7,-4.2,47,52.38],[-21.7,-2.8,49,53.4],[-21.7,-2.1,50,54.42],[-21.7,0.0,53,56.45],[-20.3,0.0,55,57.46],[-19.6,0.0,56,58.48],[-17.5,0.0,59,59.49],[-16.1,0.0,61,60.51],[-14.7,0.0,63,61.52],[-13.3,0.0,65,63.55],[-11.9,0.0,67,64.57],[-10.5,0.0,69,65.58],[-9.1,0.0,71,66.6],[-7.7,0.0,73,67.61],[-6.3,0.0,75,69.64],[-4.9,0.0,77,70.66],[-4.2,0.0,78,71.67],[-2.8,0.0,80,72.69],[-0.7,0.0,83,73.7],[0.7,0.0,85,74.72],[1.4,0.0,86,76.75],[3.5,0.0,89,77.76],[4.9,0.0,91,78.78],[5.6,0.0,92,87.91]];
const STEP_LENGTH_M = 0.70;          // config.STEP_LENGTH_M (placeholder until measured)
const LANDMARKS = [{ i: 0, label: "Entrance", color: C.purple }, { i: 20, label: "Elevator", color: C.purple }];
// Haptic patterns from store/haptics.py (ms on, off, on, ...)
const PATTERNS = { turn_left: [500, 150, 150], on_track: [600], arrived: [700, 200, 700, 200, 700], tick: [50] };

// cumulative distance along the walk
const CUM = [0];
for (let i = 1; i < WALK.length; i++) CUM.push(CUM[i - 1] + Math.hypot(WALK[i][0] - WALK[i - 1][0], WALK[i][1] - WALK[i - 1][1]));
const TOTAL_M = CUM[CUM.length - 1];

// Return guidance to the Elevator: walk the saved path backwards (as store/guidance.py does),
// merge legs that share a heading, turn = sign of the heading change (clockwise = right).
function planReturn(fromIdx, toIdx) {
  const pts = []; for (let i = fromIdx; i >= toIdx; i--) pts.push(WALK[i]);
  const legs = [];
  for (let i = 1; i < pts.length; i++) {
    const dx = pts[i][0] - pts[i - 1][0], dy = pts[i][1] - pts[i - 1][1], d = Math.hypot(dx, dy);
    if (d < 1e-6) continue;
    const hd = Math.atan2(dx, dy) * 180 / Math.PI;
    const last = legs[legs.length - 1];
    if (last && Math.abs(wrapDeg(hd - last.hd)) < 30) last.m += d; else legs.push({ hd, m: d });
  }
  const out = [];
  legs.forEach((l, k) => {
    if (k > 0) { const turn = wrapDeg(l.hd - legs[k - 1].hd); out.push(turn > 0 ? "Turn right" : "Turn left"); }
    out.push("Walk " + Math.round(l.m / STEP_LENGTH_M) + " steps");
  });
  return out;
}
function wrapDeg(a) { a = ((a + 180) % 360 + 360) % 360 - 180; return a; }
const RETURN_STEPS = planReturn(WALK.length - 1, 20);

// ---- Narration (ElevenLabs, voice River from config.py). Times in seconds.
// Captions are burned in: the ad must work with the sound off.
let VO = [
  { id: "vo1", t: 0.9, d: 2.6, text: "Every place you go leaves a trail." },
  { id: "vo2", t: 6.1, d: 5.6, text: "Say “remember this as the entrance.” Wayback Trail pins it to the path you actually walked." },
  { id: "vo3", cx: 560, maxw: 860, t: 13.6, d: 6.8, text: "Every step counted. Every turn mapped. And when it’s time to go back, it guides you — step by step." },
  { id: "vo4a", t: 22.5, d: 2.3, text: "Can’t see? It talks you through every turn." },
  { id: "vo4b", t: 25.0, d: 2.2, text: "Can’t hear? It glows, and it buzzes." },
  { id: "vo4c", t: 27.4, d: 2.0, text: "Can’t speak? Just tap and type." },
  { id: "vo5", t: 31.5, d: 1.2, text: "In the crowd." },
  { id: "vo6", bottom: 120, t: 36.6, d: 1.8, text: "In places you’ve never been." },
  { id: "vo7", t: 42.6, d: 1.8, text: "And places no one else is." },
  { id: "vo8", t: 48.6, d: 5.0, text: "Across the country. Around the world. The way back is always with you." },
  { id: "vo9", t: 56.0, d: 2.0, text: "This is the Wayback Trail." },
];

// ---------------------------------------------------------------- helpers
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eio = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;      // ease in-out cubic
const eout = k => 1 - Math.pow(1 - k, 4);                                      // ease out quart
const espring = k => { if (k <= 0) return 0; if (k >= 1) return 1; return 1 - Math.exp(-6 * k) * Math.cos(9 * k); };
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }
function fade(t, a, b, inD = .5, outD = .5) { return Math.min(seg(t, a, a + inD), 1 - seg(t, b - outD, b)); }

function font(w, px) { return w + " " + px + "px " + F; }
function text(c, s, x, y, o = {}) {
  c.save();
  c.font = font(o.w || 600, o.size || 48);
  c.textAlign = o.align || "left"; c.textBaseline = o.base || "alphabetic";
  if (o.ls != null && "letterSpacing" in c) c.letterSpacing = o.ls + "px";
  c.globalAlpha *= o.a == null ? 1 : o.a;
  if (o.grad) {
    const m = c.measureText(s), wd = m.width;
    const x0 = o.align === "center" ? x - wd / 2 : o.align === "right" ? x - wd : x;
    const g = c.createLinearGradient(x0, 0, x0 + wd, 0);
    o.grad.forEach((col, i) => g.addColorStop(i / (o.grad.length - 1), col));
    c.fillStyle = g;
  } else c.fillStyle = o.color || C.white;
  if (o.shadow) { c.shadowColor = o.shadow; c.shadowBlur = o.blur || 30; }
  c.fillText(s, x, y);
  c.restore();
}
// Apple-style headline reveal: each word rises out of a mask with a slight blur.
function reveal(c, s, x, y, t, t0, o = {}) {
  const words = s.split(" ");
  c.save(); c.font = font(o.w || 700, o.size || 96);
  if (o.ls != null && "letterSpacing" in c) c.letterSpacing = o.ls + "px";
  const space = c.measureText(" ").width;
  const widths = words.map(w => c.measureText(w).width);
  const total = widths.reduce((a, b) => a + b, 0) + space * (words.length - 1);
  let cx = o.align === "center" ? x - total / 2 : x;
  c.restore();
  words.forEach((wd, i) => {
    const k = eout(seg(t, t0 + i * (o.stagger || .08), t0 + i * (o.stagger || .08) + .7));
    c.save();
    c.beginPath(); c.rect(cx - 10, y - (o.size || 96) * 1.05, widths[i] + 20, (o.size || 96) * 1.35); c.clip();
    c.filter = k < 1 ? "blur(" + ((1 - k) * 10).toFixed(1) + "px)" : "none";
    text(c, wd, cx, y + (1 - k) * (o.size || 96) * .9, Object.assign({}, o, { align: "left", a: (o.a == null ? 1 : o.a) * k }));
    c.restore();
    cx += widths[i] + space;
  });
}
function rrect(c, x, y, w, h, r) { c.beginPath(); c.roundRect ? c.roundRect(x, y, w, h, r) : c.rect(x, y, w, h); }
function glass(c, x, y, w, h, r, o = {}) {
  c.save();
  c.shadowColor = "rgba(0,0,0,.45)"; c.shadowBlur = 50; c.shadowOffsetY = 20;
  rrect(c, x, y, w, h, r); c.fillStyle = o.fill || "rgba(28,28,30,.78)"; c.fill();
  c.shadowColor = "transparent";
  c.lineWidth = 1.5; c.strokeStyle = o.stroke || "rgba(255,255,255,.14)"; c.stroke();
  const g = c.createLinearGradient(x, y, x, y + h * .5); g.addColorStop(0, "rgba(255,255,255,.08)"); g.addColorStop(1, "rgba(255,255,255,0)");
  rrect(c, x, y, w, h, r); c.fillStyle = g; c.fill();
  c.restore();
}
function glowBlob(c, x, y, r, col, a = 1) {
  const g = c.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, hexA(col, .55 * a)); g.addColorStop(.4, hexA(col, .18 * a)); g.addColorStop(1, hexA(col, 0));
  c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2);
}
function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return "rgba(" + (n >> 16 & 255) + "," + (n >> 8 & 255) + "," + (n & 255) + "," + a + ")"; }
function pill(c, s, x, y, o = {}) {
  c.save(); c.font = font(o.w || 600, o.size || 26);
  const w = c.measureText(s).width + (o.dot ? 58 : 40), h = (o.size || 26) * 1.9;
  const x0 = o.align === "center" ? x - w / 2 : o.align === "right" ? x - w : x;
  c.globalAlpha *= o.a == null ? 1 : o.a;
  rrect(c, x0, y - h / 2, w, h, h / 2); c.fillStyle = o.fill || "rgba(44,44,46,.85)"; c.fill();
  c.lineWidth = 1.5; c.strokeStyle = o.stroke || "rgba(255,255,255,.12)"; c.stroke();
  if (o.dot) { c.beginPath(); c.arc(x0 + 26, y, 8, 0, 7); c.fillStyle = o.dot; c.shadowColor = o.dot; c.shadowBlur = 16; c.fill(); c.shadowBlur = 0; }
  c.fillStyle = o.color || C.white; c.textBaseline = "middle"; c.textAlign = "left";
  c.fillText(s, x0 + (o.dot ? 44 : 20), y + 1);
  c.restore();
  return w;
}

// Walking person, side view, drawn with rounded strokes. phase in radians.
function walker(c, x, y, s, phase, o = {}) {
  const body = o.color || "#e9e9ee";
  c.save(); c.translate(x, y); c.scale(s * (o.flip ? -1 : 1), s);
  c.lineCap = "round"; c.lineJoin = "round"; c.strokeStyle = body; c.fillStyle = body;
  const sw = Math.sin(phase), bob = Math.abs(Math.cos(phase)) * 3;
  c.translate(0, -bob);
  const hip = [0, -95], sh = [4, -175];
  function limb(base, a1, a2, l1, l2, w) {
    const k = [base[0] + Math.sin(a1) * l1, base[1] + Math.cos(a1) * l1];
    const e = [k[0] + Math.sin(a1 + a2) * l2, k[1] + Math.cos(a1 + a2) * l2];
    c.lineWidth = w; c.beginPath(); c.moveTo(base[0], base[1]); c.lineTo(k[0], k[1]); c.lineTo(e[0], e[1]); c.stroke();
    return e;
  }
  c.globalAlpha *= .55; limb(hip, -sw * .5, Math.max(0, sw) * -.6, 50, 50, 19); limb(sh, sw * .55, -.35, 40, 38, 14); c.globalAlpha /= .55;
  c.lineWidth = 30; c.beginPath(); c.moveTo(hip[0], hip[1]); c.lineTo(sh[0], sh[1]); c.stroke();
  limb(hip, sw * .5, Math.max(0, -sw) * -.6, 50, 50, 20);
  const hand = limb(sh, -sw * .55, -.35, 40, 38, 15);
  c.beginPath(); c.arc(8, -205, 21, 0, 7); c.fill();
  if (o.band) {   // the band on the front wrist
    c.save(); c.fillStyle = "#111"; c.beginPath(); c.arc(hand[0], hand[1] - 9, 8, 0, 7); c.fill();
    c.restore();
    c.restore();
    return [x + hand[0] * s * (o.flip ? -1 : 1), y + (hand[1] - 9 - bob) * s];
  }
  c.restore();
  return null;
}

/* =============================================================== SCENES
   Each scene draws itself from local time lt (seconds since its start).
   ================================================================== */

// 0  Intro — "Every place you go leaves a trail."  Vexo x Wayback Trail lockup.
function sIntro(c, lt) {
  c.fillStyle = "#000"; c.fillRect(0, 0, W, H);
  // slowly turning Apple-Intelligence style glow
  c.save(); c.translate(W / 2, H / 2);
  const a = lt * .35;
  c.globalCompositeOperation = "lighter";
  GLOW.forEach((col, i) => {
    const ang = a + i * Math.PI / 3;
    glowBlob(c, Math.cos(ang) * 420, Math.sin(ang) * 180, 520, col, .55 * seg(lt, 0, 1.6));
  });
  c.restore();
  // a trail being drawn across the frame (the shape of the recorded walk, stretched)
  const k = eio(seg(lt, .2, 3.4));
  c.save(); c.translate(W / 2, H / 2 + 230); c.lineWidth = 6; c.lineCap = "round"; c.lineJoin = "round";
  const g = c.createLinearGradient(-900, 0, 900, 0); GLOW.forEach((col, i) => g.addColorStop(i / 5, col));
  c.strokeStyle = g; c.shadowColor = C.pink; c.shadowBlur = 24; c.beginPath();
  for (let s = 0; s <= 200 * k; s++) { const u = s / 200, px = -900 + u * 1800, py = Math.sin(u * 7.5) * 38 * Math.sin(u * Math.PI) - 20; s ? c.lineTo(px, py) : c.moveTo(px, py); }
  c.stroke();
  if (k > 0 && k < 1) { const u = k, px = -900 + u * 1800, py = Math.sin(u * 7.5) * 38 * Math.sin(u * Math.PI) - 20; c.shadowBlur = 0; c.beginPath(); c.arc(px, py, 11, 0, 7); c.fillStyle = "#fff"; c.fill(); }
  c.restore();
  const lineA = 1 - seg(lt, 3.0, 3.5);
  reveal(c, "Every place you go", W / 2, 470, lt, .8, { size: 104, w: 700, align: "center", ls: -2, a: lineA });
  reveal(c, "leaves a trail.", W / 2, 590, lt, 1.5, { size: 104, w: 700, align: "center", ls: -2, grad: GLOW, a: lineA });
  // lockup
  const kl = eout(seg(lt, 3.4, 4.4));
  if (kl > 0) {
    c.save(); c.globalAlpha = kl; c.filter = "blur(" + ((1 - kl) * 12) + "px)";
    text(c, "VEXO", W / 2 - 40, 545, { size: 86, w: 800, align: "right", ls: 14 });
    text(c, "×", W / 2, 540, { size: 60, w: 300, align: "center", color: C.gray });
    text(c, "Wayback Trail", W / 2 + 40, 545, { size: 86, w: 700, align: "left", ls: -1, grad: GLOW });
    text(c, "A Vexo partnership", W / 2, 625, { size: 30, w: 500, align: "center", color: C.gray, ls: 6 });
    c.restore();
  }
}

// 1  Close-up of the band on a wrist: listening (blue), saved (purple), recording (amber)
function drawWrist(c, lt, ledCol, ledPulse) {
  // studio backdrop
  const bg = c.createRadialGradient(W * .55, H * .45, 100, W * .5, H * .5, 1300);
  bg.addColorStop(0, "#2a2a2e"); bg.addColorStop(1, "#050506"); c.fillStyle = bg; c.fillRect(0, 0, W, H);
  // bokeh
  const r = rng(7); c.save(); c.globalCompositeOperation = "lighter";
  for (let i = 0; i < 26; i++) { const x = r() * W, y = r() * H * .7, s = 30 + r() * 90; glowBlob(c, x + Math.sin(lt * .3 + i) * 20, y, s, [C.blue, C.purple, C.teal, C.orange][i % 4], .25); }
  c.restore();
  // forearm: tapered rounded shape from lower-left to right
  c.save(); c.translate(W * .5, H * .58); c.rotate(-.16);
  const skin = c.createLinearGradient(0, -200, 0, 200);
  skin.addColorStop(0, "#d9a27c"); skin.addColorStop(.5, "#b97b56"); skin.addColorStop(1, "#7c4c32");
  c.fillStyle = skin;
  c.beginPath();
  c.moveTo(-1300, -230); c.bezierCurveTo(-600, -215, -150, -150, 260, -140);
  c.bezierCurveTo(520, -135, 760, -175, 980, -210);       // hand
  c.bezierCurveTo(1150, -230, 1250, -40, 1100, 40);
  c.bezierCurveTo(900, 150, 600, 140, 260, 145);
  c.bezierCurveTo(-150, 150, -600, 210, -1300, 240); c.closePath(); c.fill();
  // subtle highlight
  const hl = c.createLinearGradient(0, -150, 0, 0); hl.addColorStop(0, "rgba(255,255,255,.18)"); hl.addColorStop(1, "rgba(255,255,255,0)");
  c.fillStyle = hl; c.fill();
  // the band
  const bx = 120;
  const band = c.createLinearGradient(bx - 90, 0, bx + 90, 0);
  band.addColorStop(0, "#0b0b0c"); band.addColorStop(.5, "#26262a"); band.addColorStop(1, "#0b0b0c");
  c.fillStyle = band; rrect(c, bx - 85, -185, 170, 370, 60); c.fill();
  c.strokeStyle = "rgba(255,255,255,.12)"; c.lineWidth = 2; c.stroke();
  // the pod
  c.shadowColor = "rgba(0,0,0,.6)"; c.shadowBlur = 30;
  rrect(c, bx - 105, -110, 210, 200, 54); const pod = c.createLinearGradient(0, -110, 0, 90);
  pod.addColorStop(0, "#3a3a3e"); pod.addColorStop(1, "#151517"); c.fillStyle = pod; c.fill(); c.shadowBlur = 0;
  c.strokeStyle = "rgba(255,255,255,.2)"; c.lineWidth = 2; c.stroke();
  // LED
  if (ledCol) {
    c.save(); c.globalCompositeOperation = "lighter";
    glowBlob(c, bx, -10, 260 * ledPulse, ledCol, ledPulse);
    c.restore();
    c.beginPath(); c.arc(bx, -10, 22, 0, 7); c.fillStyle = ledCol; c.shadowColor = ledCol; c.shadowBlur = 40 * ledPulse; c.fill(); c.shadowBlur = 0;
  } else { c.beginPath(); c.arc(bx, -10, 22, 0, 7); c.fillStyle = "#222"; c.fill(); }
  text(c, "VEXO", bx, 62, { size: 22, w: 700, align: "center", ls: 6, color: "rgba(255,255,255,.45)" });
  c.restore();

// 2  Walking + live app overlay drawing the recorded path
function sWalk(c, lt) {

  c.fillStyle = bg; c.fillRect(0, 0, W, H);
  const hz = 430, vx = 520;
  c.save(); c.strokeStyle = "rgba(255,255,255,.07)"; c.lineWidth = 2;
  for (let i = -12; i <= 12; i++) { c.beginPath(); c.moveTo(vx, hz); c.lineTo(vx + i * 260, H); c.stroke(); }
  const speed = lt < 6.6 ? 1 : lt < 7.1 ? 1 - seg(lt, 6.6, 7.1) : seg(lt, 7.1, 7.6) ;
  const off = (lt * .9) % 1;
  for (let j = 0; j < 14; j++) { const z = (j + off) / 14, y = hz + Math.pow(z, 2.2) * (H - hz); c.globalAlpha = z; c.beginPath(); c.moveTo(0, y); c.lineTo(1080, y); c.stroke(); }

  c.restore();
  // door on the far wall (the entrance)
  c.fillStyle = "rgba(255,255,255,.05)"; c.fillRect(vx - 40, hz - 140, 80, 140);
  const ph = lt * 6.2;
  const wrist = walker(c, 470, 960, 2.55, ph, { band: true, color: "#ececf1" });
  // haptic + LED glow at wrist
  if (wrist) {
    const guiding = lt > 6.4;

    c.save(); c.globalCompositeOperation = "lighter"; glowBlob(c, wrist[0], wrist[1], 60, col, .9); c.restore();
  }
  text(c, "Close-up", 90, 120, { size: 24, w: 600, color: C.gray, ls: 4, a: seg(lt, 0, .4) });
  text(c, "Walking, recording, guiding.", 90, 170, { size: 46, w: 700, a: seg(lt, 0, .5) });

  // ---- app overlay (glass phone card)
  const kIn = espring(seg(lt, .2, 1.2));
  const ox = 1110, oy = 70, ow = 720, oh = 940;
  c.save(); c.translate(ox + ow / 2, oy + oh / 2); c.scale(.9 + .1 * kIn, .9 + .1 * kIn); c.globalAlpha = seg(lt, .2, .7); c.translate(-(ox + ow / 2), -(oy + oh / 2));
  glass(c, ox, oy, ow, oh, 56, { fill: "rgba(22,22,24,.86)" });
  text(c, "Wayback Trail", ox + 48, oy + 78, { size: 34, w: 700 });
  const rec = lt < 6.4;
  pill(c, rec ? "Recording" : "Guiding back", ox + ow - 48, oy + 66, { dot: rec ? C.orange : C.white, align: "right", size: 22 });

  // progress through the recorded walk: 0.9 s .. 6.2 s maps onto the whole log
  const p = eio(seg(lt, .9, 6.2));
  const target = p * TOTAL_M;
  let i = 0; while (i < CUM.length - 2 && CUM[i + 1] < target) i++;
  const f = CUM[i + 1] > CUM[i] ? clamp((target - CUM[i]) / (CUM[i + 1] - CUM[i])) : 0;
  const cur = [lerp(WALK[i][0], WALK[i + 1][0], f), lerp(WALK[i][1], WALK[i + 1][1], f)];
  const steps = Math.round(lerp(WALK[i][2], WALK[i + 1][2], f));

  // map area
  const mx = ox + 40, my = oy + 120, mw = ow - 80, mh = 380;
  rrect(c, mx, my, mw, mh, 32); c.fillStyle = "rgba(0,0,0,.55)"; c.fill();
  c.save(); rrect(c, mx, my, mw, mh, 32); c.clip();
  c.strokeStyle = "rgba(255,255,255,.05)"; c.lineWidth = 1;
  for (let gx = mx; gx < mx + mw; gx += 40) { c.beginPath(); c.moveTo(gx, my); c.lineTo(gx, my + mh); c.stroke(); }

  const sc = 21, cx0 = mx + mw / 2 + 8 * sc, cy0 = my + mh / 2 - 3.85 * sc;  // fit -21.7..5.6 x -7.7..0

  for (let k = 0; k <= i; k++) { const q = P(WALK[k]); k ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1]); }
  const qc = P(cur); c.lineTo(qc[0], qc[1]); c.stroke(); c.shadowBlur = 0;

  }

// 4  Crowded: a plaza from above, a trail threading the crowd
function sCrowd(c, lt) {
  c.fillStyle = "#0b0c10"; c.fillRect(0, 0, W, H);
  // floor pattern
  c.strokeStyle = "rgba(255,255,255,.04)"; c.lineWidth = 2;
  for (let x = 0; x < W; x += 120) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, H); c.stroke(); }
  for (let y = 0; y < H; y += 120) { c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke(); }
  const zoom = 1.08 - .08 * eio(seg(lt, 0, 5));
  c.save(); c.translate(W / 2, H / 2); c.scale(zoom, zoom); c.translate(-W / 2, -H / 2);
  const r = rng(42);
  for (let n = 0; n < 340; n++) {
    const sx = r() * W, sy = r() * H, ang = r() * Math.PI * 2, sp = 30 + r() * 70;
    let x = (sx + Math.cos(ang) * sp * lt) % W; if (x < 0) x += W;
    let y = (sy + Math.sin(ang) * sp * lt) % H; if (y < 0) y += H;
    c.beginPath(); c.arc(x, y, 9, 0, 7); c.fillStyle = "rgba(174,174,178," + (.35 + r() * .35) + ")"; c.fill();
  }
  // our walker's path through the crowd
  const path = [[1700, 950], [1500, 820], [1320, 860], [1100, 700], [880, 760], [700, 560], [480, 600], [300, 380]];
  const k = eio(seg(lt, .3, 4.6));
  const curve = t => { const f = t * (path.length - 1), i = Math.min(path.length - 2, Math.floor(f)), u = f - i; const a = path[i], b = path[i + 1]; return [lerp(a[0], b[0], u), lerp(a[1], b[1], u)]; };
  c.lineCap = "round"; c.lineJoin = "round"; c.lineWidth = 10; c.strokeStyle = C.blue; c.shadowColor = C.blue; c.shadowBlur = 30; c.beginPath();
  const N = 120; for (let s = 0; s <= N * k; s++) { const p = curve(s / N); s ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]); } c.stroke(); c.shadowBlur = 0;
  const me = curve(k);
  c.save(); c.globalCompositeOperation = "lighter"; glowBlob(c, me[0], me[1], 120, C.blue, 1); c.restore();
  c.beginPath(); c.arc(me[0], me[1], 16, 0, 7); c.fillStyle = "#fff"; c.fill();
  // meeting point pin
  c.beginPath(); c.arc(1700, 950, 16, 0, 7); c.fillStyle = C.purple; c.fill(); c.strokeStyle = "#fff"; c.lineWidth = 4; c.stroke();
  pill(c, "Meeting point", 1700, 890, { align: "center", dot: C.purple, size: 24 });
  c.restore();
  sceneTitle(c, lt, "Crowded.", "Retrace your steps when the crowd hides every landmark.");
}

function sUnfamiliar(c, lt) {

    for (let i = -6; i <= 6; i++) { c.beginPath(); c.moveTo(cx, hz); c.lineTo(cx + i * 150, H); c.stroke(); }
    const off = (lt * .9) % 1;

// 6  Isolated: out of the cave, down the mountain

/* ============================================================ TIMELINE
   Scene boundaries and the Apple-style transition used to enter each scene. */
const SCENES = [
  { a: 0, b: 5.5, draw: sIntro },
  { a: 5.5, b: 13, draw: sCloseup, enter: "zoom" },      // push in through the glow onto the wrist
  { a: 13, b: 22, draw: sWalk, enter: "push" },           // slide over, parallax
  { a: 22, b: 31, draw: sSenses, enter: "card" },         // scene shrinks into a card and falls away
  { a: 31, b: 36, draw: sCrowd, enter: "iris" },          // circular reveal
  { a: 36, b: 42, draw: sUnfamiliar, enter: "blur" },     // blur dissolve
  { a: 42, b: 48, draw: sIsolated, enter: "push" },
  { a: 48, b: 55, draw: sGlobe, enter: "zoom" },
  { a: 55, b: 60, draw: sEnd, enter: "blur" },
];
const TR = .9;   // transition length (s), centred on each boundary
const layerA = document.createElement("canvas"), layerB = document.createElement("canvas");
[layerA, layerB].forEach(l => { l.width = W; l.height = H; });
const lA = layerA.getContext("2d"), lB = layerB.getContext("2d");

let showCaptions = true;
function render(t) {
  t = clamp(t, 0, DURATION);
  ctx.save(); ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  let idx = SCENES.findIndex(s => t >= s.a && t < s.b); if (idx < 0) idx = SCENES.length - 1;
  const s = SCENES[idx];
  const prev = idx > 0 ? SCENES[idx - 1] : null, next = SCENES[idx + 1];
  let mode = null, k = 0, out = null, inn = null;
  if (prev && t < s.a + TR / 2 && s.enter) { mode = s.enter; k = eio((t - (s.a - TR / 2)) / TR); out = prev; inn = s; }
  else if (next && t > s.b - TR / 2 && next.enter) { mode = next.enter; k = eio((t - (s.b - TR / 2)) / TR); out = s; inn = next; }
  if (!mode) {
    lA.clearRect(0, 0, W, H); s.draw(lA, t - s.a); ctx.drawImage(layerA, 0, 0);
  } else {
    lA.clearRect(0, 0, W, H); lB.clearRect(0, 0, W, H);
    out.draw(lA, t - out.a); inn.draw(lB, Math.max(0, t - inn.a));
    composite(mode, k);
  }
  if (showCaptions) drawCaption(t);
  // fade from/to black at the very ends
  const edge = Math.max(1 - seg(t, 0, .4), seg(t, 59.4, 60));
  if (edge > 0) { ctx.fillStyle = "rgba(0,0,0," + edge + ")"; ctx.fillRect(0, 0, W, H); }
  ctx.restore();
}
function composite(mode, k) {
  const c = ctx;
  if (mode === "zoom") {
    c.save(); c.globalAlpha = 1 - k; c.filter = "blur(" + (k * 18) + "px)"; c.translate(W / 2, H / 2); c.scale(1 + k * .35, 1 + k * .35); c.drawImage(layerA, -W / 2, -H / 2); c.restore();
    c.save(); c.globalAlpha = k; c.filter = "blur(" + ((1 - k) * 18) + "px)"; c.translate(W / 2, H / 2); c.scale(.85 + k * .15, .85 + k * .15); c.drawImage(layerB, -W / 2, -H / 2); c.restore();
  } else if (mode === "push") {
    c.save(); c.translate(-k * W * .35, 0); c.globalAlpha = 1 - k * .7; c.drawImage(layerA, 0, 0); c.restore();
    c.save(); c.translate((1 - k) * W, 0); c.shadowColor = "rgba(0,0,0,.6)"; c.shadowBlur = 80; c.drawImage(layerB, 0, 0); c.restore();
  } else if (mode === "card") {
    c.drawImage(layerB, 0, 0);
    const s = 1 - k * .45, r = 20 + k * 60;
    c.save(); c.globalAlpha = 1 - seg(k, .55, 1); c.translate(W / 2, H / 2 + k * k * 500); c.scale(s, s);
    c.shadowColor = "rgba(0,0,0,.7)"; c.shadowBlur = 90; rrect(c, -W / 2, -H / 2, W, H, r / s); c.fillStyle = "#000"; c.fill(); c.shadowBlur = 0;
    rrect(c, -W / 2, -H / 2, W, H, r / s); c.clip(); c.drawImage(layerA, -W / 2, -H / 2); c.restore();
  } else if (mode === "iris") {
    c.drawImage(layerA, 0, 0);
    c.save(); c.beginPath(); c.arc(W / 2, H / 2, k * Math.hypot(W, H) / 2 + 1, 0, 7); c.clip(); c.drawImage(layerB, 0, 0); c.restore();
  } else {   // blur dissolve
    c.save(); c.filter = "blur(" + (k * 24) + "px)"; c.globalAlpha = 1 - k; c.drawImage(layerA, 0, 0); c.restore();
    c.save(); c.filter = "blur(" + ((1 - k) * 24) + "px)"; c.globalAlpha = k; c.drawImage(layerB, 0, 0); c.restore();
  }
}
function drawCaption(t) {
  const v = VO.find(l => t >= l.t - .05 && t < l.t + l.d + .35);
  if (!v) return;
  const a = Math.min(seg(t, v.t - .05, v.t + .15), 1 - seg(t, v.t + v.d + .1, v.t + v.d + .35));
  ctx.save(); ctx.font = font(600, 34);
  const words = v.text.split(" "), lines = []; let line = "";
  words.forEach(w => { const tryL = line ? line + " " + w : w; if (ctx.measureText(tryL).width > (v.maxw || 1300) && line) { lines.push(line); line = w; } else line = tryL; });
  lines.push(line);
  const lh = 48, bw = Math.max(...lines.map(l => ctx.measureText(l).width)) + 56, bh = lines.length * lh + 26;
  const y = H - (v.bottom || 72) - bh;
  const cx = v.cx || W / 2;
  ctx.globalAlpha = a;
  rrect(ctx, cx - bw / 2, y, bw, bh, 22); ctx.fillStyle = "rgba(0,0,0,.62)"; ctx.fill();
  ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.textBaseline = "top";
  lines.forEach((l, i) => ctx.fillText(l, cx, y + 16 + i * lh));
  ctx.restore();
}

/* ============================================================ PLAYBACK */
const params = new URLSearchParams(location.search);
const renderMode = params.has("render");
if (renderMode) document.body.classList.add("render");
const track = document.getElementById("track");
const playBtn = document.getElementById("play"), scrub = document.getElementById("scrub"), timeEl = document.getElementById("time"), ccBtn = document.getElementById("cc");
let playing = false, t0 = 0, startAt = 0, now = 0, haveTrack = false, spoken = new Set();
// narration.mp3 = music + River narration (build.py). Without it: music.mp3 + the browser's voice.
let useSpeech = false;
track.addEventListener("canplaythrough", () => { haveTrack = true; });
track.addEventListener("error", () => {
  haveTrack = false;
  if (!useSpeech) { useSpeech = true; track.src = "audio/music.mp3"; track.load(); }
});
fetch("audio/timing.json").then(r => r.ok ? r.json() : null).then(j => { if (j && Array.isArray(j.vo)) j.vo.forEach(x => { const v = VO.find(y => y.id === x.id); if (v) { v.t = x.t; v.d = x.d; } }); }).catch(() => {});

function fmt(s) { s = Math.max(0, s); return Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0"); }
function frame(ts) {
  if (playing) {
    now = haveTrack && !track.paused ? track.currentTime : startAt + (ts - t0) / 1000;
    if (!haveTrack || useSpeech) speakFallback(now);
    if (now >= DURATION) { now = DURATION; stop(); }
  }
  render(now);
  scrub.value = now; timeEl.textContent = fmt(now) + " / 1:00";
  if (!renderMode) requestAnimationFrame(frame);
}
function speakFallback(t) {   // only when the narration file is missing: browser voice
  if (!("speechSynthesis" in window)) return;
  VO.forEach(v => { if (t >= v.t && t < v.t + .3 && !spoken.has(v.id)) { spoken.add(v.id); const u = new SpeechSynthesisUtterance(v.text.replace(/[“”]/g, "")); u.rate = 1.05; speechSynthesis.speak(u); } });
}
function start() {
  playing = true; playBtn.textContent = "Pause"; if (now >= DURATION) now = 0;
  startAt = now; t0 = performance.now(); spoken = new Set(VO.filter(v => v.t < now).map(v => v.id));
  if (haveTrack) { track.currentTime = now; track.play().catch(() => { haveTrack = false; }); }
}
function stop() { playing = false; playBtn.textContent = "Play"; track.pause(); if ("speechSynthesis" in window) speechSynthesis.cancel(); }
playBtn.onclick = () => playing ? stop() : start();
scrub.oninput = () => { now = +scrub.value; if (playing) start(); };
ccBtn.onclick = () => { showCaptions = !showCaptions; ccBtn.setAttribute("aria-pressed", String(showCaptions)); };
addEventListener("keydown", e => { if (e.code === "Space") { e.preventDefault(); playBtn.click(); } });

window.__render = t => render(t);           // used by render.mjs for frame-exact video
window.__ready = document.fonts.ready.then(() => document.fonts.load("800 40px Montserrat")).then(() => true);
window.__ready.then(() => { render(0); if (!renderMode) requestAnimationFrame(frame); });
</script>
</body>
